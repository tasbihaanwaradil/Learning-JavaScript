<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="products-heading">Products</h1>

    <!-- pending state -->
    <div class="loading" id="loading">
        Loading products ....

    </div>

    <!-- Filter -->
    <div class="filter">

        <!-- search product -->
        <input type="text" placeholder="Search product...." id="search">

        <!-- Filter product by category -->
        <select id="category">
            <option value="all">All Categories</option>

        </select>

        <!-- Price Filter -->
        <div class="price-filter">
            <label>Max Price: <span id="priceValue">$1000</span></label>
            <input type="range" id="priceRange" min="0" max="1000" value="500">
        </div>


    </div>

    <div class="products" id="products">
        <!-- <div class="card">
            <img src="" alt="">
            <h3>Perfume</h3>
            <h2>Price : $120</h2>
            <button>Add to Cart</button>
        </div> -->

    </div>

    <script src="script.js"></script>
</body>

</html>
