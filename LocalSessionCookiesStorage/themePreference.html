<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Preference</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Theme Preference</h1>

        <p>
            Switch between Light and Dark mode. Your selected theme should
            remain even after refreshing the page.
        </p>

        <div class="theme-box">

            <div class="theme-info">
                <span id="themeName">Light Mode ☀️</span>
            </div>

            <button id="toggleTheme">
                Toggle Theme
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
